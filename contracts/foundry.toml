[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
whitechain_sepolia = "https://rpc.testnet.whitechain.io"

# Verify on Blockscout (trailing slash required):
# forge verify-contract <addr> src/PaymentRouter.sol:PaymentRouter \
#   --rpc-url whitechain_sepolia --verifier blockscout \
#   --verifier-url https://explorer.testnet.whitechain.io/api/
