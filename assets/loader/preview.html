<!doctype html>
<html><head><meta charset="utf-8"><title>WhitePay loader test</title>
<style>body{margin:0;background:#0a0c19;display:flex;gap:16px;padding:16px;flex-wrap:wrap}div{width:240px;height:240px;background:#0a0c19;border:1px solid #2a3158}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script></head>
<body><div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div><div id="r"></div>
<script>
window.results = {};
const mk = (id, file, frame) => new Promise(res => {
  const anim = lottie.loadAnimation({ container: document.getElementById(id), renderer: "svg", loop: true, autoplay: frame === null, path: file });
  anim.addEventListener("DOMLoaded", () => { if (frame !== null) anim.goToAndStop(frame, true); res({ frames: anim.totalFrames, fr: anim.frameRate }) });
  anim.addEventListener("data_failed", () => res({ error: "data_failed" }));
});
Promise.all([
  mk("a", "whitepay-loader.json", 30), mk("b", "whitepay-loader.json", 63),
  mk("c", "whitepay-loader.json", 80), mk("d", "whitepay-loader.json", 100),
  mk("r", "whitepay-loader-reduced.json", 60),
]).then(r => { window.results = r });
</script></body></html>
